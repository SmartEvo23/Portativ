name: portativ
description: "Portativ - Teoria Muzicii pe înțelesul tuturor"

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Utility Packages
  http: ^1.0.0
  intl: ^0.18.1
  intl_phone_field: ^3.2.0
  flutter_native_splash: ^2.3.5
  smooth_page_indicator: ^1.1.0
  url_launcher: ^6.2.1
  connectivity_plus: ^5.0.1
  logger: ^2.0.2+1
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  audioplayers: ^6.0.0

  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.6.5
  get_storage: ^2.1.1

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_storage: ^12.1.3
  cloud_firestore: ^5.2.1
  google_sign_in: ^6.1.6
  flutter_facebook_auth: ^6.0.2

  # Piano
  # tonic: ^0.2.3
  # flutter_midi: ^0.1.1+3

#------------------------------------- ./ PACKAGES END ---------------------#

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  flutter_launcher_icons: "^0.13.1"
flutter_launcher_icons:
    android: "launcher_icon"
    ios: true
    image_path: "assets/logos/cheia-sol-colorat.png"
    min_sdk_android: 21


flutter:
  uses-material-design: true

  #--------------- LOCAL ASSETS ------------------#
  assets:
    - assets/logos/
    - assets/images/content/
    - assets/images/animations/
    - assets/images/on_boarding_images/
    - assets/images/mascots/
    - assets/sounds/Piano.sf2
    - assets/sounds/notes/

  #--------------- LOCAL FONTS ------------------#
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800
