org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin's incremental compiler has a Windows bug computing relative paths when
# the project and the Flutter pub cache live on different drive letters (D:\ vs C:\),
# which throws "this and base files have different roots". Incremental compilation off.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
